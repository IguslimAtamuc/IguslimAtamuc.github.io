<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Silva - Site Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-top: 30px;
        }
        .domain {
            font-size: 1.5rem;
            color: #ffd700;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👈 Black Silva</h1>
        <p>Site-ul tău oficial este acum LIVE pe GitHub Pages!</p>
        
        <div class="info">
            <h2>Domeniul tău gratuit:</h2>
            <div class="domain">IgsulmAlamuc.github.io</div>
            <p style="margin-top: 20px;">
                Acest domeniu poate fi transferat sau conectat la orice hosting dorești.
                Poți uploada HTML, CSS, JS și site-ul va funcționa instant.
            </p>
        </div>
    </div>
</body>
</html>
